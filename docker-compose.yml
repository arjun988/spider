services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: spider-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spider}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spider}
      POSTGRES_DB: ${POSTGRES_DB:-spider}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spider} -d ${POSTGRES_DB:-spider}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: spider-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Dedicated Postgres for LiteLLM Admin UI / virtual keys (separate from Spider DB)
  litellm-db:
    image: postgres:16-alpine
    container_name: spider-litellm-db
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:-litellm}
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: spider-litellm
    ports:
      - "4000:4000"
    environment:
      # Explicit LiteLLM DB — do not inherit Spider DATABASE_URL from .env
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:-litellm}@litellm-db:5432/litellm
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-spider-litellm-dev}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-spider-litellm-salt-dev}
      LITELLM_LOG: ${LITELLM_LOG:-INFO}
      STORE_MODEL_IN_DB: "True"
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-sk-spider-litellm-dev}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spider-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spider}:${POSTGRES_PASSWORD:-spider}@postgres:5432/${POSTGRES_DB:-spider}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-spider}:${POSTGRES_PASSWORD:-spider}@postgres:5432/${POSTGRES_DB:-spider}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # Reach the in-compose LiteLLM proxy (Gemini remains default provider)
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-spider-litellm-dev}
      LITELLM_MODEL: ${LITELLM_MODEL:-gemini/gemini-2.5-flash}
      LITELLM_EMBEDDING_MODEL: ${LITELLM_EMBEDDING_MODEL:-gemini/text-embedding-004}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - repos_data:/data/repos
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spider-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-spider}:${POSTGRES_PASSWORD:-spider}@postgres:5432/${POSTGRES_DB:-spider}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-spider}:${POSTGRES_PASSWORD:-spider}@postgres:5432/${POSTGRES_DB:-spider}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-spider-litellm-dev}
      LITELLM_MODEL: ${LITELLM_MODEL:-gemini/gemini-2.5-flash}
      LITELLM_EMBEDDING_MODEL: ${LITELLM_EMBEDDING_MODEL:-gemini/text-embedding-004}
    volumes:
      - ./backend:/app
      - repos_data:/data/repos
      - ./secrets:/app/secrets:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spider-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Spider}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  repos_data:
  litellm_postgres_data: